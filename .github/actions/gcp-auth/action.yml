name: 'Authenticate to GCP'
description: 'Authenticate to Google Cloud using Workload Identity Federation'

inputs:
  project_id:
    required: true
    type: string
  pool_id:
    required: true
    type: string
  project_number:
    required: true
    type: string
  wip_sa:
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
      id: gcp-auth
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/${{ inputs.pool_id }}/providers/github
        service_account: ${{ inputs.wip_sa }}@${{ inputs.project_id }}.iam.gserviceaccount.com
        token_format: access_token
