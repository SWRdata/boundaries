name: ty

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tasks/make_boundaries/**"
      - "scripts/**"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "tasks/make_boundaries/**"
      - "scripts/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          enable-cache: true
      - name: uv sync tasks
        working-directory: tasks/make_boundaries
        run: uv sync
      - name: ty check tasks
        working-directory: tasks/make_boundaries
        run: uvx ty check src
      - name: uv sync scripts
        working-directory: scripts
        run: uv sync
      - name: ty check scripts
        working-directory: scripts
        run: uvx ty check
