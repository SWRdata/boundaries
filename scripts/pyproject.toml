[project]
name = "scripts"
version = "0.1.0"
description = "Utility scripts"
requires-python = ">=3.12"
dependencies = [
    "common",
    "docker>=7.2.0",
    "requests>=2.32.5",
    "typed-argument-parser>=1.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.24",
]

[too.ruff]
line-length =  140

[tool.ruff.lint]
select = ["I"]

[tool.uv.sources]
common = { workspace = true }
